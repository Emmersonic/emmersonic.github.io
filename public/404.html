<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- GitHub Pages serves this with a real HTTP 404, so it stays out of the
         index rather than becoming a soft 404 pointing at "/". -->
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#fbfaf9" />
    <title>Page not found &middot; Taylor Emmerson</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fbfaf9;
        color: #1a1a1a;
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.5rem;
        font-weight: 500;
      }
      p {
        margin: 0;
        color: #6b6b6b;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Page not found</h1>
      <p>Head back to <a href="/">emmersonic.com</a>.</p>
    </div>
  </body>
</html>
