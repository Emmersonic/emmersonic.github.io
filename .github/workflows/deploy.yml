name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Emmersonic/portfolio-licensed-assets
          token: ${{ secrets.LICENSED_ASSETS_PAT }}
          path: .licensed-assets

      - run: |
          mkdir -p src/assets/fonts
          cp .licensed-assets/fonts/NewSpirit-Regular.woff2 src/assets/fonts/
          cp .licensed-assets/fonts/NewSpirit-Medium.woff2 src/assets/fonts/
          rm -rf .licensed-assets

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
